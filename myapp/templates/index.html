<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Phone Number</th>
                <th>Joined Date</th>
            </tr>
        </thead>
        <tbody>
            {% for x in people_list %}
            <tr>
                <td>{{ x.first_name }}</td>
                <td>{{ x.last_name }}</td>
                <td>{{ x.phone_number }}</td>
                <td>{{ x.joined_date }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
